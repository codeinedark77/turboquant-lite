[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant-lite"
version = "0.1.0"
description = "Pluggable TurboQuant KV-cache quantization, scoped for consumer-VRAM local inference."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27.0",
    "uvicorn>=0.29",
    "transformers>=4.45",
    "numpy",
]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "transformers>=4.45"]
empire = ["langchain-openai>=1.0", "langchain-core>=1.0"]

[tool.pytest.ini_options]
testpaths = ["validation"]

[tool.setuptools]
packages = ["core", "server", "kernels", "inference", "empire_integration"]
