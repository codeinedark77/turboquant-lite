[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant-lite"
version = "0.1.0"
description = "Pluggable TurboQuant KV-cache quantization, scoped for consumer-VRAM local inference."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# transformers>=4.40 previously stated here was too permissive: this code
# requires the CacheLayerMixin/AttentionInterface API (inference/kv_cache.py,
# inference/attention_hook.py), which post-dates 4.40 -- confirmed working
# against 5.14.1 in this project's actual testing, not verified further back
# than that, so pinning to the tested floor rather than guessing lower.
serve = ["fastapi>=0.110", "uvicorn>=0.29", "transformers>=5.14"]
empire = ["langchain-openai>=1.0", "langchain-core>=1.0"]

[tool.pytest.ini_options]
testpaths = ["validation"]

[tool.setuptools]
packages = ["core", "server", "kernels", "inference", "empire_integration"]
